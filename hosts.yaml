lumi:
  hosts:
    lumi-uan01.csc.fi:
      ansible_connection: "ssh"
      ansible_python_interpreter: "/opt/cray/pe/python/3.11.7/bin/python3.11"
      ansible_remote_tmp: "/tmp/$USER/.ansible/tmp"
  vars:
    group: "appl_csc"
    appl_dir: "/appl/local/csc/soft/math"
    modulefiles_dir: "/appl/local/csc/modulefiles"
    bin_files: ["matlab", "matlab-proxy-app"]
    bin_templates: ["matlab-singularity-exec"]
    version_files: []
    module_subdir: "matlab"
roihu_cpu:
  hosts:
    roihu-cpu-inst.csc.fi:
      ansible_connection: "ssh"
      ansible_python_interpreter: "/usr/bin/python3.9"
  vars:
    group: "r_installation_general"
    appl_dir: "/appl/soft/manual/general/x86_64"
    modulefiles_dir: "/appl/modulefiles/manual/general/x86_64"
    bin_files: ["matlab", "matlab-proxy-app"]
    bin_templates: ["matlab-apptainer-exec", "worker"]
    version_files: ["extract_binaries.sh"]
    module_subdir: "matlab"
roihu_gpu:
  hosts:
    roihu-gpu-inst.csc.fi:
      ansible_connection: "ssh"
      ansible_python_interpreter: "/usr/bin/python3.9"
  vars:
    group: "r_installation_general"
    appl_dir: "/appl/soft/manual/general/aarch64"
    modulefiles_dir: "/appl/modulefiles/manual/general/aarch64"
    bin_files: ["matlab"]
    bin_templates: ["matlab-apptainer-exec", "worker"]
    version_files: ["extract_binaries.sh"]
    module_subdir: ".matlab"
