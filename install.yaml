- name: "Install matlab environment"
  hosts: "{{ system }}"
  become: false

  tasks:
    - name: "Directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "ug=rwx,o=rx,g+s"
        group: "{{ group }}"
      loop:
        - "{{ appl_dir }}/matlab"
        - "{{ appl_dir }}/matlab/{{ version }}"
        - "{{ appl_dir }}/matlab/{{ version }}/bin"
        - "{{ modulefiles_dir }}/{{ module_subdir }}"

    - name: "Executable scripts"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/system/{{ system }}/version/{{ version }}/bin/{{ item }}"
        dest: "{{ appl_dir }}/matlab/{{ version }}/bin/{{ item }}"
        mode: "ug=rwx,o=rx"
        group: "{{ group }}"
      loop: "{{ bin_files }}"

    - name: "Version files"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/system/{{ system }}/version/{{ version }}/{{ item }}"
        dest: "{{ appl_dir }}/matlab/{{ version }}/{{ item }}"
        mode: "ug=rwx,o=rx"
        group: "{{ group }}"
      loop: "{{ version_files }}"

    - name: "Executable script templates"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/system/{{ system }}/version/{{ version }}/bin/{{ item }}.j2"
        dest: "{{ appl_dir }}/matlab/{{ version }}/bin/{{ item }}"
        mode: "ug=rwx,o=rx"
        group: "{{ group }}"
      loop: "{{ bin_templates }}"

    - name: "Regular files"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/system/{{ system }}/version/{{ version }}/matlab.lua.j2"
        dest: "{{ modulefiles_dir }}/{{ module_subdir }}/{{ version }}.lua"
        mode: "ug=rw,o=r"
        group: "{{ group }}"

    - name: "Container file dummy. Real container should be scp'ed to its place."
      ansible.builtin.file:
        path: "{{ appl_dir }}/matlab/{{ version }}/matlab.sif"
        state: "touch"
        modification_time: "preserve"
        access_time: "preserve"
        mode: "ug=rwx,o=rx"

- name: "Synchronize across LUMI Lustres"
  hosts: "{{ system }}"
  become: false

  tasks:
    - name: "Create a matlab application directory"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "directory"
        mode: "ug=rwx,o=rx,g+s"
        group: "{{ group }}"
      loop:
        - "/pfs/lustrep1/{{ appl_dir }}/matlab"
        - "/pfs/lustrep3/{{ appl_dir }}/matlab"
        - "/pfs/lustrep4/{{ appl_dir }}/matlab"
      when: system == "lumi"

    - name: "Synchronize installation"
      ansible.builtin.command: |
        rsync --archive --delete "{{ item.src }}" "{{ item.dest }}"
      loop:
        - src: "/pfs/lustrep2/{{ appl_dir }}/matlab/{{ version }}"
          dest: "/pfs/lustrep1/{{ appl_dir }}/matlab"
        - src: "/pfs/lustrep2/{{ appl_dir }}/matlab/{{ version }}"
          dest: "/pfs/lustrep3/{{ appl_dir }}/matlab"
        - src: "/pfs/lustrep2/{{ appl_dir }}/matlab/{{ version }}"
          dest: "/pfs/lustrep4/{{ appl_dir }}/matlab"
      when: system == "lumi"

    - name: "Synchronize modulefiles"
      ansible.builtin.command: |
        rsync --archive --delete "{{ item.src }}" "{{ item.dest }}"
      loop:
        - src: "/pfs/lustrep2/{{ modulefiles_dir }}/matlab"
          dest: "/pfs/lustrep1/{{ modulefiles_dir }}"
        - src: "/pfs/lustrep2/{{ modulefiles_dir }}/matlab"
          dest: "/pfs/lustrep3/{{ modulefiles_dir }}"
        - src: "/pfs/lustrep2/{{ modulefiles_dir }}/matlab"
          dest: "/pfs/lustrep4/{{ modulefiles_dir }}"
      when: system == "lumi"
